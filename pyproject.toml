[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overnight-runner"
version = "0.1.0"
description = "Bounded local-model work pipeline: tiny contracts, deterministic safety, no autonomous agents."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
overnight-runner = "overnight_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
